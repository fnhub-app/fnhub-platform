<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>{NATION_SHORT} Housing — Support</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script>try{var _t=sessionStorage.getItem("clfn_theme_css");if(_t)document.documentElement.style.cssText+=";"+_t;}catch(e){}</script>

<link rel="stylesheet" href="housing.css"/>

<script src="shared.js"></script>
<script src="shared-config.js"></script>
<script src="shared-auth.js"></script>
<script src="shared-ui.js"></script>
<script src="approval-authority.js"></script>
<script src="shared-data.js"></script>
<script src="notifications.js"></script>
<script src="shared-contract.js"></script>
<script src="scoring.js"></script>
<script src="housing-views.js"></script>
<script src="housing-settings.js"></script>
<script src="housing-modals.js"></script>
<script src="shared-sow.js"></script>
<script src="housing-modals-sow.js"></script>
<script src="housing-app.js"></script>
<script src="help-training.js"></script>
<script src="resources.js"></script>
<script src="support-widget.js"></script>
<script src="housing-init.js"></script>
<script src="ai-assistant.js"></script>

<style>body{ opacity:0; transition:opacity .15s ease; }</style>
</head>
<body>

<div id="app_header_host"></div>

<div class="app-wrapper" id="appWrapper">
  <div class="content-area">
    <div id="supportView" class="page-view-wide">

      <div class="page-back-row">
        <button onclick="history.back()" class="back-btn-yellow">&#8592; Back</button>
      </div>

      <div class="page-header-bar">
        <div class="phb-title">
          <h1>Support</h1>
          <p>Help requests and issue reports from staff and members</p>
        </div>
        <div class="phb-actions">
          <button class="btn btn-ghost" onclick="if(typeof loadSupportTickets==='function')loadSupportTickets();">&#8635; Refresh</button>
        </div>
      </div>

      <!-- KPI strip -->
      <div id="support_kpi_strip" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;"></div>

      <!-- Filters -->
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">
        <input id="support_filter_q" type="text" class="tic-input" style="max-width:280px;"
          placeholder="Search reporter / subject / details…"
          oninput="window._supQ=this.value;renderSupportList()"/>
        <select id="support_filter_status" class="tic-input" style="max-width:170px;"
          onchange="window._supStatus=this.value;renderSupportList()">
          <option value="open_new">Open (new + in progress)</option>
          <option value="new">New</option>
          <option value="open">In progress</option>
          <option value="resolved">Resolved</option>
          <option value="">All</option>
        </select>
        <select id="support_filter_cat" class="tic-input" style="max-width:190px;"
          onchange="window._supCat=this.value;renderSupportList()">
          <option value="">All categories</option>
          <option value="app_bug">Bug</option>
          <option value="access">Sign-in / access</option>
          <option value="housing">Housing question</option>
          <option value="feature">Feature request</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="card" style="overflow:hidden;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="text-align:left;border-bottom:1px solid var(--border);color:var(--muted);">
                <th style="padding:10px 12px;">From</th>
                <th style="padding:10px 12px;">Category</th>
                <th style="padding:10px 12px;">Subject</th>
                <th style="padding:10px 12px;">Received</th>
                <th style="padding:10px 12px;">Status</th>
                <th style="padding:10px 12px;"></th>
              </tr>
            </thead>
            <tbody id="support_tbody">
              <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted);">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div><!-- /supportView -->
  </div>
</div>

<!-- Triage modal host -->
<div id="support_modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;align-items:center;justify-content:center;padding:16px;"></div>

<!-- Toast host (shared) -->
<div id="toast_host" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;"></div>

<script src="support-init.js"></script>
</body>
</html>
