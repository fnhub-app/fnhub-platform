name: Deploy platform (control-plane) Edge Functions

# Deploys the CONTROL-PLANE Edge Functions to the fnhub-platform project:
#   - provision-nation      (admin calls it; keep JWT verification ON)
#   - report-nation-usage   (nation apps call it; JWT verification OFF)
#   - recurring-invoices    (pg_cron calls it; JWT verification OFF)
#   - set-nation-secret     (admin calls it; verifies super_admins itself)
#   - enter-nation          (admin calls it; keep JWT verification ON) - support login;
#                           signs a per-nation token with the private key in
#                           nation_support_keys. See docs/SUPPORT-LOGIN.md.
#   - gen-support-key       (admin calls it; keep JWT verification ON) - generates a
#                           per-nation ES256 keypair; needs nation_support_keys.sql run.
#
# These are excluded from deploy-supabase-functions.yml (which targets the
# NATION project). This workflow reuses the same account-scoped
# SUPABASE_ACCESS_TOKEN secret. The platform project ref defaults to the
# publishable ref below; override with an optional SUPABASE_PLATFORM_PROJECT_ID
# repository secret if it ever changes.
#
# IMPORTANT: provision-nation also needs a SB_MGMT_TOKEN secret set on the
# platform project's Edge Function secrets (Supabase dashboard -> Project
# Settings -> Edge Functions -> Secrets) so it can run the bootstrap schema on a
# new nation's project via the Management API. Deploying the function does not
# set that secret.
#
# recurring-invoices needs a CRON_SECRET secret (shared with the pg_cron job)
# and, for auto_send emails, RESEND_API_KEY + EMAIL_FROM. See
# docs/RECURRING-INVOICING.md for the full setup (schema, secrets, cron).

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/provision-nation/**'
      - 'supabase/functions/report-nation-usage/**'
      - 'supabase/functions/recurring-invoices/**'
      - 'supabase/functions/set-nation-secret/**'
      - 'supabase/functions/set-nation-module/**'
      - 'supabase/functions/enter-nation/**'
      - 'supabase/functions/gen-support-key/**'
      - 'supabase/functions/run-nation-migration/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-platform-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Supabase token
        id: secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add SUPABASE_ACCESS_TOKEN to enable platform function deploys."
          fi

      - name: Set up Supabase CLI
        if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy control-plane functions
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PLATFORM_REF_SECRET: ${{ secrets.SUPABASE_PLATFORM_PROJECT_ID }}
        run: |
          set -e
          REF="${PLATFORM_REF_SECRET:-dnaxulsdetlnpupegoiq}"
          # --yes is required: newer Supabase CLI refuses to deploy in a
          # non-interactive shell (no TTY to confirm) and exits 1 otherwise.
          echo "──── Deploying provision-nation to $REF (JWT verify ON) ────"
          supabase functions deploy provision-nation --project-ref "$REF" --yes
          echo "──── Deploying report-nation-usage to $REF (JWT verify OFF) ────"
          supabase functions deploy report-nation-usage --project-ref "$REF" --no-verify-jwt --yes
          echo "──── Deploying recurring-invoices to $REF (JWT verify OFF; x-cron-secret gated) ────"
          supabase functions deploy recurring-invoices --project-ref "$REF" --no-verify-jwt --yes
          echo "──── Deploying set-nation-secret to $REF (verifies caller against super_admins) ────"
          supabase functions deploy set-nation-secret --project-ref "$REF" --no-verify-jwt --yes
          echo "──── Deploying set-nation-module to $REF (verifies caller against super_admins) ────"
          supabase functions deploy set-nation-module --project-ref "$REF" --no-verify-jwt --yes
          echo "──── Deploying enter-nation to $REF (JWT verify ON; super-admin support login) ────"
          supabase functions deploy enter-nation --project-ref "$REF" --yes
          echo "──── Deploying gen-support-key to $REF (JWT verify ON; generates per-nation keypairs) ────"
          supabase functions deploy gen-support-key --project-ref "$REF" --yes
          echo "──── Deploying run-nation-migration to $REF (JWT verify ON; fleet schema updates) ────"
          supabase functions deploy run-nation-migration --project-ref "$REF" --yes
          echo "Platform functions deployed."
