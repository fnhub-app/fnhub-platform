<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Housing Member Portal</title>
<style>
  :root{
    --accent:#f8e41a; --ink:#1b1a17; --muted:#6c6a62; --hair:#e5e3db;
    --bg:#f6f5f1; --surface:#ffffff; --danger:#b91c1c; --ok:#15803d;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-text-size-adjust:100%;padding:0 0 40px}
  .bar{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
  .bar .logo{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#111;
    display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0}
  .bar b{font-size:15px;font-weight:700}
  .bar span{font-size:11px;opacity:.7;display:block;font-weight:500}
  .bar .out{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:6px 0 2px;font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  /* Notes thread — matches the staff app's shared chat-style notes (shared.css
     .notes-thread), restated with the portal's own tokens. */
  .note-msg{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
  .note-avatar{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--bg);
    border:1px solid var(--hair);color:var(--ink);display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:12px;line-height:1}
  .note-main{min-width:0;flex:1 1 auto}
  .note-head{font-size:11.5px;color:var(--muted);margin-bottom:3px;line-height:1.3}
  .note-head .note-author{font-weight:700;color:var(--ink)}
  .note-bubble{background:var(--bg);border:1px solid var(--hair);border-radius:4px 14px 14px 14px;
    padding:8px 12px;font-size:13.5px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin:14px 0 5px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--hair);border-radius:9px;
    font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(248,228,26,.35)}
  h4{margin:16px 0 2px;font-size:14px;font-weight:800}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.grid2{grid-template-columns:1fr}}
  .check{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:var(--ok);
    display:grid;place-items:center;font-size:34px;margin:0 auto 16px}
  .btn{width:100%;margin-top:20px;padding:15px;border:none;border-radius:11px;background:var(--accent);
    color:#111;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink)}
  .msg{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:13px;display:none}
  .msg.err{background:#fef2f2;border:1px solid #fecaca;color:var(--danger);display:block}
  .msg.ok{background:#dcfce7;border:1px solid #bbf7d0;color:var(--ok);display:block}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:16px 18px;margin-top:14px}
  /* Section headers mirror the staff Tenant Information Card's .tic-section-h
     (small-caps, letter-spaced, hairline underline) so the member portal and
     the staff TIC read as one product. */
  .card h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--hair)}
  /* Hero + glance strip — the portal's version of the TIC shell
     (.tic-hero + .tic-strip): hero card with the member's name, then a
     1px-gapped tile grid of at-a-glance values. */
  .pshell{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;margin-top:6px}
  .phero{padding:18px;border-bottom:1px solid var(--hair)}
  .phero-name{font-size:20px;font-weight:800;line-height:1.2}
  .phero-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .pstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair)}
  .pstrip-tile{background:var(--surface);padding:12px 14px;min-width:0}
  .pstrip-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .pstrip-val{font-size:14px;font-weight:700;line-height:1.25;overflow-wrap:break-word}
  .sublist{list-style:none;margin:8px 0 0;padding:0}
  .sublist li{border:1px solid var(--hair);border-radius:9px;padding:11px 13px;margin-bottom:8px;font-size:14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.4px}
  .pill.draft{background:#f3f4f6;color:#555} .pill.submitted{background:#fef9c3;color:#854d0e}
  .pill.approved{background:#dcfce7;color:#166534} .pill.rejected{background:#fee2e2;color:#991b1b}
  .pill.changes_requested{background:#ffedd5;color:#9a3412} .pill.in_review{background:#e0f2fe;color:#075985}
  .pill.withdrawn{background:#f3f4f6;color:#888}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:8px 0}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin-top:26px}
  .center{text-align:center;padding:34px 18px}
  /* Guided maintenance report */
  .choice{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--hair);
    border-radius:10px;padding:13px 14px;font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer;margin-bottom:8px}
  .choice:active{border-color:var(--accent)}
  .choice.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(248,228,26,.35);font-weight:700}
  .photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .thumb{position:relative;width:86px;height:86px;border-radius:9px;overflow:hidden;border:1px solid var(--hair)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border:none;border-radius:50%;
    background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1;cursor:pointer}
  .addphoto{display:block;width:100%;border:2px dashed var(--hair);border-radius:11px;background:var(--surface);
    font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;padding:16px 12px;margin:8px 0 0}
  .addphoto:active{border-color:var(--accent)}
  .crumb{font-size:12px;color:var(--muted);margin:0 0 10px}
  .backlink{display:inline-block;background:var(--surface);border:1px solid var(--hair);border-radius:9px;
    padding:9px 18px;margin:0 0 14px;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit}
  .backlink:active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(248,228,26,.35)}
</style>
</head>
<body>
  <div class="bar">
    <div class="logo" id="nlogo">H</div>
    <div><b id="nname">Housing</b><span>Member portal</span></div>
    <button class="out" id="btn_out" style="display:none;" onclick="applyLogout()">Sign out</button>
  </div>
  <div class="wrap" id="app">
    <div class="center"><p class="sub">Loading&hellip;</p></div>
  </div>
  <script src="shared-config.js"></script>
<script src="mrq-tree.js"></script>
  <script src="apply.js"></script>
  <script src="support-widget.js"></script>
</body>
</html>
