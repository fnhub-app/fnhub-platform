<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>FN Hub — Platform Admin</title>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  /* Palette mirrors the nation app's tokens in shared.css so the control plane
     reads as the same product. Deliberately PLATFORM branding, not a nation's:
     admin.fnhub.app manages every nation, so it carries the FN Hub wordmark and
     the generic house app-icon -- never a specific nation's logo, name or
     colours. The yellow is the product accent, not CLFN's nation identity.
     Font + icon are served under this panel's own CSP (admin/_headers). */
  :root{
    --accent:#F8E41A; --accent-light:#fffce8; --ink:#111110; --ink2:#1c1c1a;
    --muted:#696960; --hair:#e8e6df; --line:#e8e6df;
    --bg:#fafaf8; --surface:#ffffff; --danger:#b91c1c; --ok:#15803d;
    --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.07);
    --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%;padding:0 0 48px}
  .bar{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:5;border-bottom:1px solid #2a2a28}
  .bar .logo{width:32px;height:32px;border-radius:9px;display:block;flex-shrink:0}
  .bar b{font-size:15px;font-weight:700;letter-spacing:.2px}
  .bar b em{font-style:normal;color:var(--accent)}
  .bar span{font-size:11px;color:#ccc;display:block;font-weight:400;letter-spacing:.3px}
  /* Matches the app header's ghost button: grey border, yellow on hover. */
  .bar .out{margin-left:auto;background:none;border:1px solid #444;color:#ccc;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:border-color .15s,color .15s}
  .bar .out:hover{border-color:var(--accent);color:var(--accent)}
  .wrap{max-width:820px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:6px 0 2px;font-weight:700;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--hair);border-radius:9px;font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(248,228,26,.35)}
  .btn{margin-top:16px;padding:12px 16px;border:none;border-radius:var(--radius);background:var(--accent);color:var(--ink);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn.sm{margin-top:0;padding:7px 12px;font-size:12px;border-radius:8px}
  .btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink)}
  .btn.danger{background:#fef2f2;border:1px solid #fecaca;color:var(--danger)}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:13px;display:none}
  .msg.err{background:#fef2f2;border:1px solid #fecaca;color:var(--danger);display:block}
  .msg.ok{background:#dcfce7;border:1px solid #bbf7d0;color:var(--ok);display:block}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:16px 18px;margin-top:16px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.4px}
  .pill.active{background:#dcfce7;color:#166534} .pill.provisioning{background:var(--accent-light);color:#7a5c00;border:1px solid #fde68a} .pill.suspended{background:#fee2e2;color:#991b1b}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:8px 0}
  .center{text-align:center;padding:40px 18px}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin-top:26px}
  code{background:var(--accent-light);border:1px solid var(--hair);border-radius:5px;padding:1px 5px;font-size:12px}
  /* Nation Information Card -- TIC-style shell (hero + strip + tabs + body + footer) */
  .nic-shell{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
  .nic-hero{background:var(--ink);color:#fff;padding:14px 18px 16px}
  .nic-hero .back{background:none;border:1px solid #444;color:#ccc;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:10px}
  .nic-hero .back:hover{border-color:var(--accent);color:var(--accent)}
  .nic-hero h1{color:#fff;margin:0 0 2px;font-size:21px}
  .nic-hero .nic-sub{color:#bdbdb6;font-size:12px}
  .nic-hero .nic-sub code{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
  .nic-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
  .nic-strip-tile{background:var(--surface);padding:10px 14px;min-width:0}
  .nic-strip-tile .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px}
  .nic-strip-tile .v{font-size:13px;font-weight:600;overflow-wrap:anywhere}
  .nic-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
  .nic-tab{background:none;border:none;border-bottom:2px solid transparent;padding:11px 14px;font-size:13px;font-weight:600;font-family:inherit;color:var(--muted);cursor:pointer}
  .nic-tab:hover{color:var(--ink)}
  .nic-tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  .nic-body{padding:4px 18px 6px}
  .nic-panel{display:none}
  .nic-panel.active{display:block}
  .nic-panel .card{border:none;box-shadow:none;padding:0;margin:16px 0 0;border-radius:0}
  .nic-panel .card:first-child{margin-top:8px}
  .nic-panel .card+.card{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  .nic-footer{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
  .nic-footer .btn{margin-top:0}
  .nic-footer .msg{margin:0;flex:1;padding:0;background:none;border:none}
  .nic-footer .msg.err{background:none;border:none;color:var(--danger);padding:0}
  .nic-footer .msg.ok{background:none;border:none;color:var(--ok);padding:0}
  @media(max-width:640px){.nic-strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <div class="bar">
    <img class="logo" src="icon-192.png" alt=""/>
    <div><b>FN<em>Hub</em></b><span>Platform Admin</span></div>
    <!-- data-act, not onclick: this panel's CSP has no 'unsafe-inline', so an
         inline handler is blocked and the button does nothing. See admin.js. -->
    <button class="out" id="btn_out" style="display:none;" type="button" data-act="logout">Sign out</button>
  </div>
  <div class="wrap" id="app"><div class="center"><p class="sub">Loading…</p></div></div>
  <script src="admin-config.js"></script>
  <script src="admin-pricing.js"></script>
  <script src="admin.js"></script>
</body>
</html>
