<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Nation Pathways — Platform Admin</title>
<link rel="icon" type="image/png" href="icon-192.png?v=np1"/>
<link rel="apple-touch-icon" href="icon-192.png?v=np1"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
  /* Palette mirrors the nation app's tokens in shared.css so the control plane
     reads as the same product. Deliberately PLATFORM branding, not a nation's:
     admin.fnhub.app manages every nation, so it carries the Nation Pathways
     wordmark, app icon (icon-192.png, the official NP mark) and palette --
     Spruce #2E5E4E / Sage #A9C4BA / Amber #D9922E, matching nationpathways.com
     -- never a specific nation's logo, name or colours. Spruce is the accent on
     light surfaces (white text on it); Amber is the accent on the dark bars.
     Font + icon are served under this panel's own CSP (admin/_headers). */
  :root{
    --accent:#2E5E4E; --accent-bar:#D9922E; --accent-light:#ecf3f0; --dark:#223F35; --ink:#111110; --ink2:#1c1c1a;
    --muted:#696960; --hair:#e8e6df; --line:#e8e6df;
    --bg:#fafaf8; --surface:#ffffff; --danger:#b91c1c; --ok:#15803d;
    --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.07);
    --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
    /* Serif display face for page/section titles — mirrors the nation app's
       shared.css --serif so the control plane reads as the same product. */
    --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
    --input-border:#8a8880; --tr:all .18s ease;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%;padding:0 0 48px}
  .bar{background:var(--dark);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(255,255,255,.12)}
  .bar .logo{width:32px;height:32px;border-radius:9px;display:block;flex-shrink:0}
  .bar b{font-size:15px;font-weight:700;letter-spacing:.2px}
  .bar b em{font-style:normal;color:var(--accent-bar)}
  .bar span{font-size:11px;color:#ccc;display:block;font-weight:400;letter-spacing:.3px}
  /* Matches the app header's ghost button: grey border, yellow on hover. */
  .bar .out{margin-left:auto;background:none;border:1px solid #444;color:#ccc;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:border-color .15s,color .15s}
  .bar .out:hover{border-color:var(--accent-bar);color:var(--accent-bar)}
  .wrap{max-width:820px;margin:0 auto;padding:18px}
  .wrap.wide{max-width:1180px}
  /* Serif display titles mirror the nation app's .page-header-bar/.sec-hdr h1. */
  h1{font-family:var(--serif);font-size:23px;margin:6px 0 2px;font-weight:400;letter-spacing:-.1px;line-height:1.15}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}
  input,select{width:100%;padding:10px 12px;border:1.5px solid var(--input-border);border-radius:8px;font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink);transition:var(--tr)}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,94,78,.22)}
  /* Buttons mirror shared.css .btn family (padding 8/16, radius 8, 13px/600,
     1.5px border) — the .btn.ghost/.sm/.danger names stay for existing markup. */
  .btn{margin-top:16px;padding:8px 16px;border:1.5px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:var(--tr)}
  .btn:hover{background:var(--dark);border-color:var(--dark)}
  .btn.sm{margin-top:0;padding:5px 12px;font-size:12px;border-radius:6px}
  .btn.ghost{background:transparent;border:1.5px solid var(--hair);color:var(--ink)}
  .btn.ghost:hover{background:var(--bg);border-color:var(--muted)}
  .btn.danger{background:var(--danger);border:1.5px solid var(--danger);color:#fff}
  .btn.danger:hover{background:#991b1b;border-color:#991b1b}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .msg{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:13px;display:none}
  .msg.err{background:#fef2f2;border:1px solid #fecaca;color:var(--danger);display:block}
  .msg.ok{background:#dcfce7;border:1px solid #bbf7d0;color:var(--ok);display:block}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:16px 18px;margin-top:16px;box-shadow:var(--shadow)}
  .card h3{position:relative;margin:0 0 4px;padding-left:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  /* Amber left bar echoes the nation app's .page-header-bar::before accent. */
  .card h3::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:15px;background:var(--accent-bar);border-radius:2px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.4px}
  .chk-done{opacity:.6} .chk-done .chk-title{text-decoration:line-through}
  .pill.active{background:#dcfce7;color:#166534} .pill.provisioning{background:var(--accent-light);color:#2E5E4E;border:1px solid #A9C4BA} .pill.suspended{background:#fee2e2;color:#991b1b}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:8px 0}
  .center{text-align:center;padding:40px 18px}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin-top:26px}
  code{background:var(--accent-light);border:1px solid var(--hair);border-radius:5px;padding:1px 5px;font-size:12px}
  /* Nation Information Card -- TIC-style shell (hero + strip + tabs + body + footer) */
  .nic-shell{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
  /* Light page-header-bar — mirrors the nation app's .page-header-bar (serif
     title + muted subtitle + amber left accent bar + bottom divider). */
  .nic-hero{position:relative;background:var(--surface);color:var(--text);padding:22px 18px 18px 24px;border-bottom:1px solid var(--hair)}
  .nic-hero::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:4px;background:var(--accent-bar);border-radius:2px}
  .nic-hero .back{background:none;border:1.5px solid var(--hair);color:var(--ink);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:12px;transition:var(--tr)}
  .nic-hero .back:hover{border-color:var(--accent);color:var(--accent)}
  .nic-hero h1{color:var(--text);margin:0 0 3px;font-size:26px}
  .nic-hero .nic-sub{color:var(--muted);font-size:12px}
  .nic-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
  .nic-strip-tile{background:var(--surface);padding:10px 14px;min-width:0}
  .nic-strip-tile .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px}
  .nic-strip-tile .v{font-size:13px;font-weight:600;overflow-wrap:anywhere}
  .nic-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
  .nic-tab{background:none;border:none;border-bottom:2px solid transparent;padding:11px 14px;font-size:13px;font-weight:600;font-family:inherit;color:var(--muted);cursor:pointer}
  .nic-tab:hover{color:var(--ink)}
  .nic-tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  .nic-body{padding:4px 18px 6px}
  .nic-panel{display:none}
  .nic-panel.active{display:block}
  .nic-panel .card{border:none;box-shadow:none;padding:0;margin:16px 0 0;border-radius:0}
  .nic-panel .card:first-child{margin-top:8px}
  .nic-panel .card+.card{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  .nic-footer{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
  .nic-footer .btn{margin-top:0}
  .nic-footer .msg{margin:0;flex:1;padding:0;background:none;border:none}
  .nic-footer .msg.err{background:none;border:none;color:var(--danger);padding:0}
  .nic-footer .msg.ok{background:none;border:none;color:var(--ok);padding:0}
  @media(max-width:640px){.nic-strip{grid-template-columns:repeat(2,1fr)}}

  /* ============================================================
     Dashboard shell (Phase 1 redesign) — grouped left rail +
     page-hero + KPI cards. Replaces the 9 wrapping .nic-tabs on
     the dashboard. The per-nation detail view keeps .nic-* above.
     ============================================================ */
  #app.dash{max-width:none;margin:0;padding:0}
  .shell{display:grid;grid-template-columns:234px 1fr;max-width:1320px;margin:0 auto;min-height:calc(100vh - 110px)}
  .rail{border-right:1px solid var(--hair);padding:18px 12px;background:var(--surface)}
  .rail-grp{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
  .rail-grp:first-child{margin-top:0}
  .rail button{display:flex;width:100%;text-align:left;align-items:center;gap:10px;padding:8px 10px;border:none;background:none;border-radius:8px;color:var(--ink);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:2px;transition:var(--tr)}
  .rail button svg{width:17px;height:17px;flex-shrink:0;color:var(--muted)}
  .rail button:hover{background:var(--bg)}
  .rail button.active{background:var(--accent-light);color:var(--accent)}
  .rail button.active svg{color:var(--accent)}
  .rail button .cnt{margin-left:auto;font-size:10px;font-weight:800;background:var(--accent-bar);color:#fff;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center}
  .main{padding:22px 26px 48px;min-width:0}
  /* page-hero: icon chip + eyebrow + serif title + actions (mirrors the
     nation app's shared.css .page-hero). */
  .page-hero{display:flex;align-items:flex-start;gap:16px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;position:relative;overflow:hidden}
  .page-hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent-bar)}
  .page-hero-ic{flex-shrink:0;width:46px;height:46px;border-radius:12px;background:var(--accent-light);color:var(--accent);display:grid;place-items:center}
  .page-hero-ic svg{width:24px;height:24px}
  .page-hero-tx{flex:1;min-width:0}
  .page-hero-eyebrow{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--accent-bar);margin-bottom:3px}
  .page-hero-tx h1{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.1;margin:0 0 4px;letter-spacing:-.2px}
  .page-hero-tx .sub{margin:0}
  .page-hero-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  .page-hero-who{font-size:12px;color:var(--muted)}
  /* KPI cards (replace the flat .nic-strip tiles on the overview) */
  .dash-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
  .dash-kpi{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px}
  .dash-kpi .l{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .dash-kpi .l svg{width:13px;height:13px;color:var(--accent-bar);flex-shrink:0}
  .dash-kpi .v{font-size:23px;font-family:var(--serif);font-weight:400;line-height:1.05}
  .dash-kpi .m{font-size:11px;color:var(--muted);margin-top:4px}
  @media(max-width:900px){
    .shell{grid-template-columns:1fr}
    .rail{display:flex;flex-wrap:wrap;gap:4px;border-right:none;border-bottom:1px solid var(--hair);padding:10px}
    .rail-grp{display:none}
    .rail button{width:auto;margin-bottom:0}
    .dash-kpis{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:560px){.dash-kpis{grid-template-columns:1fr}.page-hero{flex-wrap:wrap}.page-hero-actions{justify-content:flex-start}}

  /* ============================================================
     std-table (Phase 2 redesign) — light table card + identity
     cells + kebab overflow menu. Mirrors the nation app's
     shared.css .std-table, in the platform palette. Overrides the
     global th/td above via higher specificity.
     ============================================================ */
  .std-sec-h{font-size:12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .std-sec-h:first-child{margin-top:4px}
  .std-table-card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);overflow:visible}
  .std-table-card .std-scroll{overflow-x:auto;border-radius:var(--radius)}
  .std-table{width:100%;border-collapse:collapse;font-size:13px;margin:0}
  .std-table th{text-align:left;background:var(--bg);color:var(--muted);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:11px 14px;border-top:none;border-bottom:1px solid var(--line)}
  .std-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .std-table tbody tr:last-child td{border-bottom:none}
  .std-table tbody tr.clickable{cursor:pointer;transition:background .12s}
  .std-table tbody tr.clickable:hover td{background:var(--accent-light)}
  .std-id{display:flex;align-items:center;gap:11px;min-width:0}
  .std-id-av{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;flex-shrink:0;font-family:var(--serif);text-transform:uppercase}
  .std-id-av.alt{background:var(--accent-bar)}
  .std-id-main{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .std-id-sub{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
  .std-rowend{text-align:right;white-space:nowrap}
  .std-chev{color:var(--muted);font-size:18px;line-height:1}
  .num{font-variant-numeric:tabular-nums}
  /* kebab overflow menu (used by Phase 2b multi-action rows) */
  .std-kebab{background:none;border:1px solid var(--hair);border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0}
  .std-kebab:hover{border-color:var(--muted);color:var(--ink)}
  .std-rowmenu{position:relative;display:inline-block}
  .std-rowmenu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--hair);border-radius:9px;box-shadow:var(--shadow);padding:5px;min-width:150px;z-index:20;display:none}
  .std-rowmenu-pop.open{display:block}
  .std-rowmenu-pop button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:7px 10px;font-size:12.5px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer}
  .std-rowmenu-pop button:hover{background:var(--bg)}
  .std-rowmenu-pop button.danger{color:var(--danger)}
</style>
</head>
<body>
  <div class="bar">
    <img class="logo" src="icon-192.png?v=np1" alt=""/>
    <div><b>Nation<em>Pathways</em></b><span>Platform Admin</span></div>
    <!-- data-act, not onclick: this panel's CSP has no 'unsafe-inline', so an
         inline handler is blocked and the button does nothing. See admin.js. -->
    <button class="out" id="btn_out" style="display:none;" type="button" data-act="logout">Sign out</button>
  </div>
  <div class="wrap" id="app"><div class="center"><p class="sub">Loading…</p></div></div>
  <script src="admin-config.js"></script>
  <script src="admin.js"></script>
  <script src="reseller.js"></script>
</body>
</html>
